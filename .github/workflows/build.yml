name: Build

# Builds the OHIF Viewer with the FHIR viewer mode from the commits pinned in
# upstream.json (scripts/build.mjs). Every run uploads the build as a workflow
# artifact so a PR can be inspected; a run on main additionally publishes a
# GitHub Release carrying ohif-viewer.tar.gz and its .sha256, and deploys the
# same build to this repository's GitHub Pages site.
#
# Prerequisites (one-time, in repo Settings → Pages): Source "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release
  pages: write # the Pages deploy
  id-token: write # actions/deploy-pages

# One release/deploy at a time; let an in-flight one finish rather than
# publishing a half-uploaded artifact.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build viewer
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # OHIF's pnpm store, keyed on the pinned commits: a rebuild at the same
      # pins reuses every downloaded package.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('upstream.json') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Build
        run: node scripts/build.mjs

      - name: Compute release tag
        id: tag
        run: |
          viewers=$(node -p "require('./upstream.json').viewers.commit.slice(0, 7)")
          ext=$(node -p "require('./upstream.json').fhirViewer.commit.slice(0, 7)")
          echo "tag=v$(date -u +%Y.%m.%d)-${viewers}-${ext}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohif-viewer
          path: |
            out/ohif-viewer.tar.gz
            out/ohif-viewer.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ohif-viewer
          path: out

      # A re-run at unchanged pins on the same day lands on an existing tag;
      # the assets are byte-identical in that case, so replacing them is safe.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          notes="Built from the commits pinned in upstream.json at ${GITHUB_SHA}."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ohif-viewer.tar.gz out/ohif-viewer.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/ohif-viewer.tar.gz out/ohif-viewer.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" --target "$GITHUB_SHA"
          fi

  deploy:
    name: Deploy Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
